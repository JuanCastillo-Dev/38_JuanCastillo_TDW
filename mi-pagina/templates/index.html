<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Animada con Flask</title>
    <!-- CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

    <div id="card" class="bg-white p-8 rounded-xl shadow-lg text-center max-w-md border border-gray-200">
        <h1 id="titulo" class="text-2xl font-bold text-gray-800 mb-4">
            Asociación Renace Cañete
        </h1>
        <p id="descripcion" class="text-gray-600 mb-6">
            Gestión y comercialización de productos agrícolas.
        </p>

        <div class="flex flex-col gap-3">
            <button id="btn-mensaje" class="bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition">
                1. Mostrar Mensaje
            </button>
            <button id="btn-contenido" class="bg-emerald-600 text-white py-2 px-4 rounded-lg hover:bg-emerald-700 transition">
                2. Cambiar Contenido
            </button>
            <button id="btn-estilo" class="bg-amber-600 text-white py-2 px-4 rounded-lg hover:bg-amber-700 transition">
                3. Modificar Estilo
            </button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
